[package]
name = "fonttest"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
anyhow = "1.0"
bymsdfgen-core = "0.1.1"
bymsdfgen-io = "0.1.1"
bytemuck = { version = "1.23", features = ["derive"] }
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11"
fontdb = "0.24"
glam = "0.30"
harfrust = "0.13"
log = "0.4"
pollster = "0.4"
read-fonts = "0.43"
unicode-linebreak = "0.1"
wgpu = "30"
winit = "0.30"

[dev-dependencies]
naga = { version = "30", features = ["wgsl-in"] }

[profile.release]
lto = "thin"
codegen-units = 1

