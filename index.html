<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MSDF Font Explorer</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #121f42;
      }

      body {
        position: fixed;
        inset: 0;
        overscroll-behavior: none;
      }

      canvas {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
        touch-action: none;
      }
    </style>
    <link data-trunk rel="rust" data-target-name="fonttest_web" />
  </head>
  <body></body>
